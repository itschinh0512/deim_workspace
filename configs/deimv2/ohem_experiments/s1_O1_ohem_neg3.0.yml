__include__: ['../deimv2_hgnetv2_n_fisheye.yml']

output_dir: ./outputs/ohem_s1_O1_ohem_neg3.0

DEIMCriterion:
  gamma: 2.0
  ohem_enabled: True
  ohem_neg_ratio: 3.0        # keep 3× positives negatives
  ohem_min_neg: 16
  ohem_warmup_epochs: 10
  matcher:
    change_matcher: True
    iou_order_alpha: 4.0
    matcher_change_epoch: 136
